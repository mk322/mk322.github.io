      <title id="uni-fig2-title">Encode, predict what follows, and generate</title>
      <desc id="uni-fig2-desc">Original Uni-LaDiR method figure. Teacher steps are encoded into thought blocks, used to predict later steps and outputs, and learned as diffusion targets. Continuation gradients reach the encoder through the thoughts; diffusion gradients stop at the clean targets. Both objectives update the shared backbone.</desc>

    <p class="uni-fig2-stage-title" data-fig2-heading>One backbone learns the thoughts and how to generate them.</p>
    <p data-fig2-explanation>Teacher steps supply training examples of reasoning. The shared backbone encodes them into thought blocks, learns to use the blocks for later predictions, and learns to generate them from noise. At inference, only the task input is needed. Solid arrows carry information; dashed arrows show gradients; snowflakes stop gradients.</p>

  <figcaption><strong>Figure 2. Encode, predict what follows, and generate.</strong> The paper's original diagram, animated one component at a time <a href="#ref-1">[1, Fig. 2]</a>. The final stages trace each loss back to the modules it trains. These are views of one jointly trained model, not separate training phases. <a href="{{ '/assets/blog/uni-ladir/fig2.svg' | relative_url }}?v=6a8b48e38b59" target="_blank" rel="noopener">Full diagram</a> · <a href="{{ '/assets/blog/uni-ladir/source/fig2.pdf' | relative_url }}">Vector PDF</a><span class="uni-pan-hint"> · Swipe to inspect a wide stage.</span></figcaption>
