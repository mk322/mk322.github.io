<figure class="uni-paper-figure uni-wide uni-training-flow" data-training-flow>
  <div class="uni-training-controls" hidden>
    <label>Training step <select data-flow-select aria-label="Training animation step">
      <option value="0">Overview: both paths</option><option value="1">1. Encode teacher steps</option><option value="2">2. Continuation forward</option><option value="3">3. Continuation gradients</option><option value="4">4. Diffusion forward</option><option value="5">5. Diffusion gradients</option><option value="6">6. Update shared weights</option>
    </select></label>
    <button type="button" data-flow-prev aria-label="Previous training step">← Previous</button><button type="button" data-flow-next>Next →</button><button type="button" data-flow-play aria-pressed="false">Play</button><button type="button" data-flow-reset>Reset</button>
  </div>
  <div class="uni-figure-scroll" tabindex="0" role="region" aria-label="Training computation graph; swipe horizontally on narrow screens">
    {% include blog/uni-ladir/training-flow-svg.html %}
  </div>
  <p class="uni-method-explanation" data-flow-explanation aria-live="polite"><strong>One backbone, two losses.</strong> Continuation gradients pass through thought blocks into the encoder. Diffusion gradients train the velocity predictor and stop at detached blocks. Both losses update the shared weights θ.</p>
  <figcaption><strong>Follow the forward computation and the gradients.</strong> The top path shows one teacher block contributing to later-step and final-output prediction; the bottom shows diffusion training for a block. Purple modules are separate uses of the same backbone. <em>sg</em> means stop-gradient. The steps explain the computation graph, not separate training stages; joint training combines the two losses <a href="#ref-1">[1, §3]</a>.<span class="uni-pan-hint"> Swipe to inspect the complete graph.</span></figcaption>
</figure>
