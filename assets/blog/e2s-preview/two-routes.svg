<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img"><title>Two routes: supervise student rollouts, or prepare student-targeted SFT data</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#747b86" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252c"><text x="12" y="28" text-anchor="start" font-size="20" font-weight="600" fill="#20252c">Move learning to the student</text><text x="12" y="53" text-anchor="start" font-size="14" font-weight="400" fill="#525a65">Start with student trajectories; bring feedback to the states they visit.</text><rect x="12" y="84" width="150" height="80" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="87.0" y="124.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Student</text><text x="87.0" y="144.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">samples responses</text><rect x="206" y="84" width="150" height="80" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="281.0" y="124.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Student rollouts</text><text x="281.0" y="144.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">visited prefixes</text><rect x="400" y="84" width="174" height="80" rx="5" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".6" stroke-width="1.1"/><text x="487.0" y="124.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Attach feedback</text><text x="487.0" y="144.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">RL reward / OPD teacher</text><rect x="618" y="84" width="150" height="80" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="693.0" y="124.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Update student</text><text x="693.0" y="144.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">RL / distillation</text><path d="M164 124 H201" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M358 124 H395" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M576 124 H613" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><text x="390" y="195" text-anchor="middle" font-size="14" font-weight="400" fill="#525a65">The learning signal is evaluated on student-generated trajectories.</text><path d="M12 221 H768" stroke="#e4e6eb"/><text x="12" y="256" text-anchor="start" font-size="20" font-weight="600" fill="#20252c">Move the data to the student</text><text x="12" y="281" text-anchor="start" font-size="14" font-weight="400" fill="#525a65">Start with an expert constraint; prepare valid responses for student SFT.</text><rect x="12" y="313" width="150" height="80" rx="5" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".6" stroke-width="1.1"/><text x="87.0" y="353.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Expert constraint</text><text x="87.0" y="373.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">what must be preserved</text><rect x="206" y="313" width="174" height="80" rx="5" fill="#f5f3fa" stroke="#6356a5" stroke-opacity=".6" stroke-width="1.1"/><text x="293.0" y="353.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Sample valid data</text><text x="293.0" y="373.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">MCMC / E2S</text><rect x="424" y="313" width="150" height="80" rx="5" fill="#eff8f7" stroke="#2b8b88" stroke-opacity=".6" stroke-width="1.1"/><text x="499.0" y="353.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Training targets</text><text x="499.0" y="373.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">more on-policy</text><rect x="618" y="313" width="150" height="80" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="693.0" y="353.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Update student</text><text x="693.0" y="373.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">SFT</text><path d="M164 353 H201" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M382 353 H419" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M576 353 H613" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="206" y="433" width="174" height="44" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="293.0" y="460.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Student policy</text><path d="M293 430 V398" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><text x="401" y="450" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">sets relative probabilities</text><text x="401" y="469" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">among valid responses</text></g></svg>