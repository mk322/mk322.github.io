<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img"><title>Two routes: supervise student rollouts, or prepare student-targeted SFT data</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#747b86" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252c"><text x="12" y="28" text-anchor="start" font-size="18" font-weight="500" fill="#20252c">A   Move learning to the student — RL / OPD</text><text x="12" y="53" text-anchor="start" font-size="14" font-weight="400" fill="#525a65">Let the student write a response, then give feedback on that attempt.</text><rect x="12" y="84" width="150" height="80" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M24 96 H44" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="87.0" y="125.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Student</text><text x="87.0" y="143.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">samples responses</text><rect x="206" y="84" width="150" height="80" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M218 96 H238" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="281.0" y="125.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Student responses</text><text x="281.0" y="143.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">generated answer</text><rect x="403" y="81" width="174" height="80" rx="6" fill="white" stroke="#ba8b51" stroke-opacity=".22" stroke-width="1"/><rect x="400" y="84" width="174" height="80" rx="6" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".42" stroke-width="1"/><path d="M412 96 H432" stroke="#ba8b51" stroke-width="2" stroke-linecap="round"/><text x="487.0" y="125.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Attach feedback</text><text x="487.0" y="143.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">reward / teacher feedback</text><rect x="618" y="84" width="150" height="80" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M630 96 H650" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="693.0" y="125.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Update student</text><text x="693.0" y="143.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">RL / OPD</text><path d="M164 124 H201" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M358 124 H395" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M576 124 H613" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><text x="390" y="195" text-anchor="middle" font-size="14" font-weight="400" fill="#525a65">Give feedback on what the student actually writes.</text><path d="M12 221 H768" stroke="#e4e6eb"/><text x="12" y="256" text-anchor="start" font-size="18" font-weight="500" fill="#20252c">B   Move the data to the student — MCMC + SFT</text><text x="12" y="281" text-anchor="start" font-size="14" font-weight="400" fill="#525a65">Start with an expert constraint; prepare valid responses for student SFT.</text><rect x="15" y="310" width="150" height="80" rx="6" fill="white" stroke="#ba8b51" stroke-opacity=".22" stroke-width="1"/><rect x="12" y="313" width="150" height="80" rx="6" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".42" stroke-width="1"/><path d="M24 325 H44" stroke="#ba8b51" stroke-width="2" stroke-linecap="round"/><text x="87.0" y="354.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Expert constraint</text><text x="87.0" y="372.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">what must be preserved</text><rect x="206" y="313" width="174" height="80" rx="6" fill="#f5f3fa" stroke="#6356a5" stroke-opacity=".42" stroke-width="1"/><path d="M218 325 H238" stroke="#6356a5" stroke-width="2" stroke-linecap="round"/><text x="293.0" y="354.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Sample valid data</text><text x="293.0" y="372.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">MCMC + SFT</text><rect x="427" y="310" width="150" height="80" rx="6" fill="white" stroke="#2b8b88" stroke-opacity=".22" stroke-width="1"/><rect x="424" y="313" width="150" height="80" rx="6" fill="#eff8f7" stroke="#2b8b88" stroke-opacity=".42" stroke-width="1"/><path d="M436 325 H456" stroke="#2b8b88" stroke-width="2" stroke-linecap="round"/><text x="499.0" y="354.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Training targets</text><text x="499.0" y="372.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">more on-policy</text><rect x="618" y="313" width="150" height="80" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M630 325 H650" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="693.0" y="354.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Update student</text><text x="693.0" y="372.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">SFT</text><path d="M164 353 H201" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M382 353 H419" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M576 353 H613" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="206" y="433" width="174" height="44" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M218 445 H238" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="293.0" y="460.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Student policy</text><path d="M293 430 V398" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><text x="401" y="450" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">sets relative probabilities</text><text x="401" y="469" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">among valid responses</text></g></svg>