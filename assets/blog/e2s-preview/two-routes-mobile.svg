<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 958" role="img"><title>Two routes: feedback on student rollouts versus new SFT targets</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#747b86" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252c"><text x="12" y="26" text-anchor="start" font-size="19" font-weight="600" fill="#20252c">Move learning to the student</text><text x="12" y="51" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">Start with student-generated trajectories.</text><rect x="40" y="78" width="280" height="76" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="180.0" y="116.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Student rollouts</text><text x="180.0" y="136.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">Sample from the current student</text><path d="M180 157 V188" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="192" width="280" height="76" rx="5" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".6" stroke-width="1.1"/><text x="180.0" y="230.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Attach feedback</text><text x="180.0" y="250.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">RL reward / OPD teacher probabilities</text><path d="M180 271 V302" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="306" width="280" height="76" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="180.0" y="344.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Update student</text><text x="180.0" y="364.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">RL / distillation</text><text x="180" y="413" text-anchor="middle" font-size="13" font-weight="400" fill="#525a65">Bring supervision to student-visited states.</text><path d="M12 443 H348" stroke="#e4e6eb"/><text x="12" y="479" text-anchor="start" font-size="19" font-weight="600" fill="#20252c">Move the data to the student</text><text x="12" y="504" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">Prepare new SFT targets before updating.</text><rect x="8" y="535" width="166" height="72" rx="5" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".6" stroke-width="1.1"/><text x="91.0" y="571.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Expert constraint</text><text x="91.0" y="591.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">what to preserve</text><rect x="186" y="535" width="166" height="72" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="269.0" y="571.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Student policy</text><text x="269.0" y="591.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">relative probabilities</text><path d="M91 610 V632 H142 V653" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M269 610 V632 H218 V653" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="657" width="280" height="76" rx="5" fill="#f5f3fa" stroke="#6356a5" stroke-opacity=".6" stroke-width="1.1"/><text x="180.0" y="695.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Sample valid data</text><text x="180.0" y="715.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">MCMC / E2S</text><path d="M180 736 V767" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="771" width="280" height="64" rx="5" fill="#eff8f7" stroke="#2b8b88" stroke-opacity=".6" stroke-width="1.1"/><text x="180.0" y="803.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Training targets</text><text x="180.0" y="823.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">more on-policy</text><path d="M180 838 V869" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="873" width="280" height="64" rx="5" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".6" stroke-width="1.1"/><text x="180.0" y="905.0" text-anchor="middle" font-size="15" font-weight="500" fill="#20252c">Update student</text><text x="180.0" y="925.0" text-anchor="middle" font-size="12" font-weight="400" fill="#525a65">SFT</text></g></svg>