<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 958" role="img"><title>Two routes: feedback on student rollouts versus new SFT targets</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#747b86" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252c"><text x="12" y="26" text-anchor="start" font-size="15" font-weight="500" fill="#20252c">A   Move learning to the student — RL / OPD</text><text x="12" y="51" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">Let the student write, then give feedback.</text><rect x="40" y="78" width="280" height="76" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M52 90 H72" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="180.0" y="117.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Student responses</text><text x="180.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">Sample from the current student</text><path d="M180 157 V188" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="43" y="189" width="280" height="76" rx="6" fill="white" stroke="#ba8b51" stroke-opacity=".22" stroke-width="1"/><rect x="40" y="192" width="280" height="76" rx="6" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".42" stroke-width="1"/><path d="M52 204 H72" stroke="#ba8b51" stroke-width="2" stroke-linecap="round"/><text x="180.0" y="231.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Attach feedback</text><text x="180.0" y="249.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">reward / teacher feedback</text><path d="M180 271 V302" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="306" width="280" height="76" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M52 318 H72" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="180.0" y="345.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Update student</text><text x="180.0" y="363.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">RL / OPD</text><text x="180" y="413" text-anchor="middle" font-size="13" font-weight="400" fill="#525a65">Give feedback on generated answer.</text><path d="M12 443 H348" stroke="#e4e6eb"/><text x="12" y="479" text-anchor="start" font-size="15" font-weight="500" fill="#20252c">B   Move the data to the student — MCMC + SFT</text><text x="12" y="504" text-anchor="start" font-size="13" font-weight="400" fill="#525a65">Prepare new SFT targets before updating.</text><rect x="11" y="532" width="166" height="72" rx="6" fill="white" stroke="#ba8b51" stroke-opacity=".22" stroke-width="1"/><rect x="8" y="535" width="166" height="72" rx="6" fill="#fbf7f0" stroke="#ba8b51" stroke-opacity=".42" stroke-width="1"/><path d="M20 547 H40" stroke="#ba8b51" stroke-width="2" stroke-linecap="round"/><text x="91.0" y="572.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Expert constraint</text><text x="91.0" y="590.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">what to preserve</text><rect x="186" y="535" width="166" height="72" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M198 547 H218" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="269.0" y="572.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Student policy</text><text x="269.0" y="590.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">relative probabilities</text><path d="M91 610 V632 H142 V653" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M269 610 V632 H218 V653" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="657" width="280" height="76" rx="6" fill="#f5f3fa" stroke="#6356a5" stroke-opacity=".42" stroke-width="1"/><path d="M52 669 H72" stroke="#6356a5" stroke-width="2" stroke-linecap="round"/><text x="180.0" y="696.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Sample valid data</text><text x="180.0" y="714.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">MCMC + SFT</text><path d="M180 736 V767" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="43" y="768" width="280" height="64" rx="6" fill="white" stroke="#2b8b88" stroke-opacity=".22" stroke-width="1"/><rect x="40" y="771" width="280" height="64" rx="6" fill="#eff8f7" stroke="#2b8b88" stroke-opacity=".42" stroke-width="1"/><path d="M52 783 H72" stroke="#2b8b88" stroke-width="2" stroke-linecap="round"/><text x="180.0" y="804.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Training targets</text><text x="180.0" y="822.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">more on-policy</text><path d="M180 838 V869" fill="none" stroke="#747b86" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="873" width="280" height="64" rx="6" fill="#f2f7fc" stroke="#3e73a8" stroke-opacity=".42" stroke-width="1"/><path d="M52 885 H72" stroke="#3e73a8" stroke-width="2" stroke-linecap="round"/><text x="180.0" y="906.0" text-anchor="middle" font-size="14" font-weight="500" fill="#20252c">Update student</text><text x="180.0" y="924.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#525a65">SFT</text></g></svg>