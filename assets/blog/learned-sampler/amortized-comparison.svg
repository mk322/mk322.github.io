<path d="M285 152h50" stroke="#aeb7c5" stroke-width="4" stroke-linecap="round"/>
<path d="M285 165h37" stroke="#3e73a8" stroke-width="4" stroke-linecap="round"/>
<path d="M285 178h42" stroke="#aeb7c5" stroke-width="4" stroke-linecap="round"/>
<path d="M355 165H370" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="378" y="136" width="82" height="58" rx="7" fill="#fff" stroke="#cad1dc" stroke-width="1.3"/>
<text x="419" y="126" font-size="15" fill="#525a65" font-weight="400" text-anchor="middle">Draft k</text>
