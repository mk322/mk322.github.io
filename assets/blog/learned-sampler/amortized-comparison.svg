<path d="M460 196V211H203V196" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="315" y="239" font-size="14" fill="#525a65" font-weight="400" text-anchor="middle">Revise the response; weights stay fixed</text>
<path d="M487 163H515" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="523" y="125" width="112" height="76" rx="8" fill="#edf7f5" stroke="#a4ccc6" stroke-width="1.3"/>
