<text x="310.5" y="497.0" font-size="16" fill="#6356a5" font-weight="500" text-anchor="middle">t₁ t₂</text>
<rect x="367" y="470" width="96" height="42" rx="8" fill="#fff" stroke="#c6badf" stroke-width="1.3"/>
<text x="415.0" y="497.0" font-size="16" fill="#6356a5" font-weight="500" text-anchor="middle">… EOS</text>
<path d="M201 491H210" fill="none" stroke="#6356a5" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#purple-arrow)"/>
<path d="M260 491H270" fill="none" stroke="#6356a5" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#purple-arrow)"/>
<path d="M346 491H359" fill="none" stroke="#6356a5" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#purple-arrow)"/>
<text x="315" y="543" font-size="15" fill="#525a65" font-weight="400" text-anchor="middle">Append tokens to build a new response</text>
<path d="M487 487H515" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="523" y="449" width="112" height="76" rx="8" fill="#edf7f5" stroke="#a4ccc6" stroke-width="1.3"/>
<text x="579.0" y="487.0" font-size="16" fill="#2b8b88" font-weight="500" text-anchor="middle">Verified</text>
<text x="579.0" y="510.0" font-size="14" fill="#525a65" font-weight="400" text-anchor="middle">SFT data</text>
