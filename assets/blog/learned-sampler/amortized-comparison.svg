<svg xmlns="http://www.w3.org/2000/svg" width="800" height="584" viewBox="0 0 800 584" role="img" aria-labelledby="title desc"><title id="title">Search each response, or reuse a learned generation policy?</title><desc id="desc">Top: MCMC revises a complete response with repeated propose, score, and accept/reject steps for each example. Bottom: first train a policy across examples using student scores and validity feedback, then reuse that policy to construct responses by appending tokens. Both routes verify outputs, collect training data, and update the student with SFT.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#525a65"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6356a5"/></marker></defs><rect width="800" height="584" rx="12" fill="#fff"/><g font-family="Helvetica Neue, Arial, sans-serif" fill="#20252c">
<rect x="12" y="12" width="776" height="250" rx="12" fill="#f8f9fb" stroke="#e1e5eb" stroke-width="1.3"/>
<text x="30" y="45" font-size="22" fill="#20252c" font-weight="600" text-anchor="start">MCMC</text>
<text x="127" y="45" font-size="18" fill="#525a65" font-weight="400" text-anchor="start">Search again for each example</text>
<rect x="30" y="125" width="94" height="76" rx="8" fill="#fff" stroke="#d7dce5" stroke-width="1.3"/>
<text x="77.0" y="163.0" font-size="16" fill="#20252c" font-weight="500" text-anchor="middle">Prompt</text>
<text x="77.0" y="186.0" font-size="14" fill="#525a65" font-weight="400" text-anchor="middle">+ expert</text>
<path d="M127 163H138" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="146" y="77" width="338" height="172" rx="10" fill="#fff" stroke="#d7dce5" stroke-width="1.3"/>
<text x="315" y="103" font-size="16" fill="#525a65" font-weight="400" text-anchor="middle">Propose · score · accept/reject</text>
<rect x="162" y="136" width="82" height="58" rx="7" fill="#fff" stroke="#cad1dc" stroke-width="1.3"/>
<text x="203" y="126" font-size="15" fill="#525a65" font-weight="400" text-anchor="middle">Draft 0</text>
<path d="M177 152h50" stroke="#aeb7c5" stroke-width="4" stroke-linecap="round"/>
