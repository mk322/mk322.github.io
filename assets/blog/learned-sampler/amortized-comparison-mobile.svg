<svg xmlns="http://www.w3.org/2000/svg" width="380" height="922" viewBox="0 0 380 922" role="img" aria-labelledby="title desc"><title id="title">Search each response, or reuse a learned generation policy?</title><desc id="desc">MCMC repeatedly revises each response with fixed weights. Sampler training changes a policy across examples; data generation reuses it to append tokens and construct a new response. Both routes end in verified data and SFT of the student.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#525a65"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6356a5"/></marker></defs><rect width="380" height="922" rx="12" fill="#fff"/><g font-family="Helvetica Neue, Arial, sans-serif" fill="#20252c">
