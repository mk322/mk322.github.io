<rect x="28" y="659" width="140" height="56" rx="8" fill="#edf7f5" stroke="#a4ccc6" stroke-width="1.3"/>
<text x="98.0" y="683" font-size="17" fill="#2b8b88" font-weight="500" text-anchor="middle">Verify</text>
<text x="98.0" y="703" font-size="14" fill="#525a65" font-weight="400" text-anchor="middle">SFT response</text>
<text x="28" y="749" font-size="15" fill="#6356a5" font-weight="400" text-anchor="start">Reuse the policy learned across prompts.</text>
</g></svg>
