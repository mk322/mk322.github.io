<svg xmlns="http://www.w3.org/2000/svg" width="380" height="786" viewBox="0 0 380 786" role="img" aria-labelledby="title desc"><title id="title">Update a response, or train a reusable sampler?</title><desc id="desc">MCMC updates the response in a repeated chain for each prompt. Amortized training updates shared sampler parameters across prompts. Data generation reuses the trained sampler, followed by verification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#525a65"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6356a5"/></marker></defs><rect width="380" height="786" rx="12" fill="#fff"/><g font-family="Helvetica Neue, Arial, sans-serif" fill="#20252c">
<rect x="10" y="10" width="360" height="314" rx="12" fill="#f8f9fb" stroke="#e1e5eb" stroke-width="1.3"/>
<text x="28" y="42" font-size="22" fill="#20252c" font-weight="600" text-anchor="start">MCMC</text>
<text x="28" y="68" font-size="17" fill="#525a65" font-weight="400" text-anchor="start">Search for each prompt</text>
<rect x="28" y="92" width="140" height="56" rx="8" fill="#fff" stroke="#d7dce5" stroke-width="1.3"/>
<text x="98.0" y="126.0" font-size="16" fill="#20252c" font-weight="500" text-anchor="middle">Current response</text>
<rect x="211" y="92" width="140" height="56" rx="8" fill="#fff" stroke="#d7dce5" stroke-width="1.3"/>
<text x="281.0" y="126.0" font-size="17" fill="#20252c" font-weight="500" text-anchor="middle">Propose + score</text>
<path d="M170 120H203" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<path d="M281 151V183" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="211" y="191" width="140" height="56" rx="8" fill="#fff" stroke="#d7dce5" stroke-width="1.3"/>
<text x="281.0" y="225.0" font-size="17" fill="#20252c" font-weight="500" text-anchor="middle">Accept / reject</text>
<path d="M209 219H98V151" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="28" y="179" font-size="15" fill="#525a65" font-weight="400" text-anchor="start">Update</text>
<text x="28" y="198" font-size="15" fill="#525a65" font-weight="400" text-anchor="start">response</text>
<path d="M281 250V275H176" fill="none" stroke="#525a65" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="233" y="268" font-size="13" fill="#525a65" font-weight="400" text-anchor="middle">End</text>
<rect x="28" y="249" width="140" height="56" rx="8" fill="#edf7f5" stroke="#a4ccc6" stroke-width="1.3"/>
<text x="98.0" y="273" font-size="17" fill="#2b8b88" font-weight="500" text-anchor="middle">Verify</text>
<text x="98.0" y="293" font-size="14" fill="#525a65" font-weight="400" text-anchor="middle">SFT response</text>
<text x="351" y="311" font-size="13" fill="#525a65" font-weight="400" text-anchor="end">Model weights fixed</text>
<rect x="10" y="340" width="360" height="434" rx="12" fill="#faf8fd" stroke="#ddd5e9" stroke-width="1.3"/>
