<rect x="188" y="520" width="160" height="56" rx="8" fill="#fff" stroke="#d7dce5" stroke-width="1.3"/>
<text x="268.0" y="554.0" font-size="17" fill="#20252c" font-weight="500" text-anchor="middle">Draw + score</text>
