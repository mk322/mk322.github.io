<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Reconstruction versus continuation prediction</title><desc id="desc">Reconstruction predicts the same teacher step from its thought. Continuation uses the thought with the task input and earlier blocks to predict the next teacher step. Final output supervision is omitted from the schematic.</desc><defs><marker id="arrow-525A65" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#525A65"/></marker><marker id="arrow-6356A5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#6356A5"/></marker><marker id="arrow-BA8B51" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#BA8B51"/></marker><marker id="arrow-2B8B88" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#2B8B88"/></marker><marker id="arrow-81739E" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#81739E"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="500.0" y="32" font-size="22" font-weight="700" fill="#20252C" text-anchor="middle">Same teacher step. A different learning objective.</text><text x="500.0" y="62" font-size="18" font-weight="400" fill="#525A65" text-anchor="middle">The target determines which information must survive.</text><g transform="translate(12,85)"><rect x="0" y="0" width="466" height="460" rx="7" fill="#FAFBFD" stroke="#D7DCE5" stroke-width="1.4"/><text x="233" y="38" font-size="25" font-weight="700" fill="#20252C" text-anchor="middle">Reconstruction</text><rect x="93" y="67" width="280" height="48" rx="7" fill="#FCF7EE" stroke="#BA8B51" stroke-width="1.4"/><text x="233.0" y="98.48" font-size="22" font-weight="700" fill="#20252C" text-anchor="middle">Teacher step i</text><path d="M233 119 L233 149" fill="none" stroke="#525A65" stroke-width="2" marker-end="url(#arrow-525A65)"/><text x="276" y="141" font-size="18" font-weight="400" fill="#525A65" text-anchor="start">Encode</text><rect x="93" y="156" width="280" height="48" rx="7" fill="#E6E1F1" stroke="#6356A5" stroke-width="1.4"/><text x="233.0" y="187.48" font-size="22" font-weight="700" fill="#20252C" text-anchor="middle">Thought block zᵢ</text><path d="M233 208 L233 294" fill="none" stroke="#525A65" stroke-width="2" marker-end="url(#arrow-525A65)"/><text x="254" y="252" font-size="19" font-weight="400" fill="#525A65" text-anchor="start">Predict</text><rect x="93" y="301" width="280" height="48" rx="7" fill="#FCF7EE" stroke="#BA8B51" stroke-width="1.4"/><text x="233.0" y="332.14" font-size="21" font-weight="700" fill="#20252C" text-anchor="middle">Same teacher step i</text><text x="233" y="391" font-size="21" font-weight="700" fill="#525A65" text-anchor="middle">Keep what reproduces the source</text><text x="233" y="425" font-size="20" font-weight="400" fill="#525A65" text-anchor="middle">Supervision looks back</text></g><g transform="translate(522,85)"><rect x="0" y="0" width="466" height="460" rx="7" fill="#F5F2FA" stroke="#CBC3DF" stroke-width="1.4"/><text x="233" y="38" font-size="25" font-weight="700" fill="#6356A5" text-anchor="middle">Continuation prediction</text><rect x="93" y="67" width="280" height="48" rx="7" fill="#FCF7EE" stroke="#BA8B51" stroke-width="1.4"/><text x="233.0" y="98.48" font-size="22" font-weight="700" fill="#20252C" text-anchor="middle">Teacher step i</text><path d="M233 119 L233 149" fill="none" stroke="#525A65" stroke-width="2" marker-end="url(#arrow-525A65)"/><text x="276" y="141" font-size="18" font-weight="400" fill="#525A65" text-anchor="start">Encode</text><rect x="93" y="156" width="280" height="48" rx="7" fill="#E6E1F1" stroke="#6356A5" stroke-width="1.4"/><text x="233.0" y="187.48" font-size="22" font-weight="700" fill="#20252C" text-anchor="middle">Thought block zᵢ</text><path d="M233 208 L233 294" fill="none" stroke="#6356A5" stroke-width="2" marker-end="url(#arrow-6356A5)"/><text x="254" y="252" font-size="19" font-weight="400" fill="#525A65" text-anchor="start">Predict</text><rect x="18" y="224" width="153" height="51" rx="7" fill="white" stroke="#D7DCE5" stroke-width="1.4"/><text x="94" y="244" font-size="17" font-weight="400" fill="#20252C" text-anchor="middle">Input + earlier</text><text x="94" y="264" font-size="17" font-weight="400" fill="#20252C" text-anchor="middle">thought blocks</text><path d="M174 250 L230 250" fill="none" stroke="#525A65" stroke-width="2" marker-end="url(#arrow-525A65)"/><rect x="93" y="301" width="280" height="48" rx="7" fill="#F1F8F7" stroke="#2B8B88" stroke-width="1.4"/><text x="233.0" y="332.14" font-size="21" font-weight="700" fill="#20252C" text-anchor="middle">Next teacher step i + 1</text><text x="233" y="391" font-size="21" font-weight="700" fill="#6356A5" text-anchor="middle">Keep what helps the next step</text><text x="233" y="425" font-size="20" font-weight="400" fill="#525A65" text-anchor="middle">Supervision looks forward</text></g><text x="500.0" y="585" font-size="17" font-weight="400" fill="#525A65" text-anchor="middle">Final answer / action supervision also trains the complete chain.</text></g></svg>