<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" role="img" aria-labelledby="task-title task-desc"><title id="task-title">Same image, different reasoning needs</title><desc id="task-desc">An illustrative image shows a red mug and a blue mug. Grasping requires handle location and gripper clearance; sorting requires color. These task demands supply different continuation supervision during training. This is not a measurement of latent contents.</desc><rect width="1000" height="565" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="500.0" y="34" font-size="24" font-weight="700" fill="#20252C" text-anchor="middle">Same image, different reasoning needs</text><text x="500.0" y="64" font-size="19" font-weight="400" fill="#525A65" text-anchor="middle">Conceptual example</text><rect x="20" y="109" width="290" height="310" rx="9" fill="#FAFBFD" stroke="#D7DCE5" stroke-width="1.5"/><text x="165" y="144" font-size="22" font-weight="700" fill="#20252C" text-anchor="middle">The same observation</text><g transform="translate(30,168) scale(1)"><path d="M15 151 L248 151 L270 174 L0 174Z" fill="#F2ECE3" stroke="#B9A58C" stroke-width="2"/><path d="M93 76 C129 66,129 120,92 114" fill="none" stroke="#BF656A" stroke-width="10"/><path d="M35 56 L99 56 L95 137 Q67 152,39 137Z" fill="#BF656A" stroke="#525A65" stroke-width="1.5"/><ellipse cx="67" cy="56" rx="32" ry="10" fill="white" fill-opacity=".75" stroke="#BF656A" stroke-width="3"/><path d="M208 90 C244 80,244 134,207 128" fill="none" stroke="#3E73A8" stroke-width="10"/><path d="M150 70 L214 70 L210 151 Q182 166,154 151Z" fill="#3E73A8" stroke="#525A65" stroke-width="1.5"/><ellipse cx="182" cy="70" rx="32" ry="10" fill="white" fill-opacity=".75" stroke="#3E73A8" stroke-width="3"/></g><text x="165" y="392" font-size="20" font-weight="400" fill="#525A65" text-anchor="middle">One image, two tasks</text><rect x="370" y="101" width="610" height="155" rx="9" fill="#F7F5FA" stroke="#CBC3DF" stroke-width="1.5"/><text x="390" y="135" font-size="24" font-weight="700" fill="#6356A5" text-anchor="start">Task A: grasp the red mug</text><text x="390" y="171" font-size="19" font-weight="700" fill="#525A65" text-anchor="start">What matters for this task</text><text x="390" y="200" font-size="22" font-weight="400" fill="#20252C" text-anchor="start">Handle location + space for the gripper</text><text x="390" y="234" font-size="21" font-weight="700" fill="#2B8B88" text-anchor="start">Next: plan the approach.</text><rect x="370" y="276" width="610" height="155" rx="9" fill="#F7F5FA" stroke="#CBC3DF" stroke-width="1.5"/><text x="390" y="310" font-size="24" font-weight="700" fill="#6356A5" text-anchor="start">Task B: sort mugs by color</text><text x="390" y="346" font-size="19" font-weight="700" fill="#525A65" text-anchor="start">What matters for this task</text><text x="390" y="375" font-size="22" font-weight="400" fill="#20252C" text-anchor="start">Which mug is red; which mug is blue</text><text x="390" y="409" font-size="21" font-weight="700" fill="#2B8B88" text-anchor="start">Next: choose each group.</text><path d="M310 263 H336 V180 H358 M336 263 V355 H358" fill="none" stroke="#525A65" stroke-width="2"/><path d="M358 175 L366 180 L358 185Z" fill="#525A65"/><path d="M358 350 L366 355 L358 360Z" fill="#525A65"/><rect x="20" y="463" width="960" height="86" rx="9" fill="#E6E1F1" stroke="#AEA1CC" stroke-width="1.5"/><text x="500" y="499" font-size="24" font-weight="700" fill="#6356A5" text-anchor="middle">The task determines which information must survive.</text><text x="500" y="530" font-size="22" font-weight="400" fill="#6356A5" text-anchor="middle">Continuation prediction trains the shared encoder to preserve it.</text></g></svg>