<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="task-title task-desc"><title id="task-title">Same image, different reasoning needs</title><desc id="task-desc">An illustrative image shows a red mug and a blue mug. Grasping requires handle location and gripper clearance; sorting requires color. These task demands supply different continuation supervision during training. This is not a measurement of latent contents.</desc><rect width="420" height="900" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="210.0" y="34" font-size="24" font-weight="700" fill="#20252C" text-anchor="middle">One image. Two tasks.</text><text x="210.0" y="64" font-size="19" font-weight="400" fill="#525A65" text-anchor="middle">Conceptual example</text><rect x="12" y="88" width="396" height="240" rx="9" fill="#FAFBFD" stroke="#D7DCE5" stroke-width="1.5"/><text x="210" y="122" font-size="23" font-weight="700" fill="#20252C" text-anchor="middle">The same observation</text><g transform="translate(76,129) scale(1)"><path d="M15 151 L248 151 L270 174 L0 174Z" fill="#F2ECE3" stroke="#B9A58C" stroke-width="2"/><path d="M93 76 C129 66,129 120,92 114" fill="none" stroke="#BF656A" stroke-width="10"/><path d="M35 56 L99 56 L95 137 Q67 152,39 137Z" fill="#BF656A" stroke="#525A65" stroke-width="1.5"/><ellipse cx="67" cy="56" rx="32" ry="10" fill="white" fill-opacity=".75" stroke="#BF656A" stroke-width="3"/><path d="M208 90 C244 80,244 134,207 128" fill="none" stroke="#3E73A8" stroke-width="10"/><path d="M150 70 L214 70 L210 151 Q182 166,154 151Z" fill="#3E73A8" stroke="#525A65" stroke-width="1.5"/><ellipse cx="182" cy="70" rx="32" ry="10" fill="white" fill-opacity=".75" stroke="#3E73A8" stroke-width="3"/></g><rect x="12" y="356" width="396" height="180" rx="9" fill="#F7F5FA" stroke="#CBC3DF" stroke-width="1.5"/><text x="32" y="390" font-size="24" font-weight="700" fill="#6356A5" text-anchor="start">Task A: grasp the red mug</text><text x="32" y="426" font-size="19" font-weight="700" fill="#525A65" text-anchor="start">What matters for this task</text><text x="32" y="455" font-size="22" font-weight="400" fill="#20252C" text-anchor="start">Handle location and</text><text x="32" y="482" font-size="22" font-weight="400" fill="#20252C" text-anchor="start">space for the gripper</text><text x="32" y="514" font-size="21" font-weight="700" fill="#2B8B88" text-anchor="start">Next: plan the approach.</text><rect x="12" y="558" width="396" height="180" rx="9" fill="#F7F5FA" stroke="#CBC3DF" stroke-width="1.5"/><text x="32" y="592" font-size="24" font-weight="700" fill="#6356A5" text-anchor="start">Task B: sort mugs by color</text><text x="32" y="628" font-size="19" font-weight="700" fill="#525A65" text-anchor="start">What matters for this task</text><text x="32" y="657" font-size="22" font-weight="400" fill="#20252C" text-anchor="start">Which mug is red;</text><text x="32" y="684" font-size="22" font-weight="400" fill="#20252C" text-anchor="start">which mug is blue</text><text x="32" y="716" font-size="21" font-weight="700" fill="#2B8B88" text-anchor="start">Next: choose each group.</text><rect x="12" y="763" width="396" height="120" rx="9" fill="#E6E1F1" stroke="#AEA1CC" stroke-width="1.5"/><text x="210" y="798" font-size="23" font-weight="700" fill="#6356A5" text-anchor="middle">Continuation prediction teaches</text><text x="210" y="827" font-size="23" font-weight="700" fill="#6356A5" text-anchor="middle">the shared encoder which</text><text x="210" y="856" font-size="23" font-weight="700" fill="#6356A5" text-anchor="middle">information to retain.</text></g></svg>